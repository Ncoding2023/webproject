<!DOCTYPE html>
<html lang="ko">

<head>

<body>

    <h2>Git 설정 생성기</h2>

    <input type="text" id="username" placeholder="gitHub 이름">

    <h3><span style="background-color: antiquewhite;">자리이동시,</span><br> 사용자 제거 하고 원격 저장소 제거 혹은 초기화한 이후, 사용자 설정 및 원격 저장소 연결</h3>
    <p>상단에 입력창에 본인 gitHub 입력한 이후 사용, 메모장에 복사 해서 cmd로 해당 경로해서 사용</p>

<div class="section">
    <h2>🔑 Git 계정 설정</h2>

    <button onclick="copyGitConfig()">

    </button>

    <button onclick="copyCheckConfig()">

    </button>
</div>

<div class="section">
    <h2>🔗 저장소 연결</h2>

    <button onclick="copyRemote()">
        원격 저장소 연결
    </button>
    

    <button onclick="copyRemoteCheck()">
        원격 저장소 확인
    </button>

    <button onclick="copyInit()">
        원격 저장소 초기화
    </button>

    <button onclick="copyRemoteRemove()">
        원격 저장소 제거
    </button>

    <button onclick="copyClone()">
        저장소 복사 받기
    </button>
</div>

<div class="section">
    <h2>📂 Git 작업</h2>

    <button onclick="copyStatus()">
        현재 상태 확인
    </button>

    <button onclick="copyBranch()">
        현재 브랜치 확인
    </button>

    <button onclick="copyPush()">
        최초 Push
    </button>

    <button onclick="copyPushUpdate()">
        일반 Push
    </button>

    <button onclick="copyPull()">
        Pull
    </button>

    <button onclick="copyCommit()">
        Commit
    </button>

    <button onclick="copyCommitMail()">
        커밋메세지 예시
    </button>
</div>

<div class="section">
    <h2>🌿 브랜치 관리</h2>

    <button onclick="copyBranch()">
        현재 브랜치 확인
    </button>

    <button onclick="copyBranchAll()">
        전체 브랜치 확인
    </button>

    <button onclick="copyBranchCreate()">
        브랜치 생성
    </button>

    <button onclick="copyBranchSwitch()">
        브랜치 이동
    </button>

    <button onclick="copyBranchCreateSwitch()">
        브랜치 생성 후 이동
    </button>

    <button onclick="copyBranchMain()">
        main 브랜치로 변경
    </button>

    <button onclick="copyBranchDelete()">
        브랜치 삭제
    </button>

    <button onclick="copyBranchMerge()">
        브랜치 병합

</div>

<h3>생성 결과 (메모장에 복사해서 사용)</h3>

<pre id="result"></pre>
<div id="copyMessage"></div>

    <script>

        function createGitConfig() {

            const username = !document.getElementById("username").value  ?
                "username" : document.getElementById("username").value;

            const email = !document.getElementById("email").value ?
                "email" : document.getElementById("email").value;

            const repository = !document.getElementById("repository").value ?
                "repository" : document.getElementById("repository").value;

            const command = `git config --global user.name ${username}
git config --global user.email ${email}
git remote add origin ${repository}
git remote -v`;

            document.getElementById("result").textContent =
                command;
        }


        function copyGitConfig() {

            const username =
                document.getElementById("username").value;

            const email =
                document.getElementById("email").value;

            const cmd =
                `git config --global user.name ${username}
git config --global user.email ${email}`;

            copyText(cmd);
        }

        function copyRemoveCredential() {

            const cmd =
                `git config --global --unset user.name
git config --global --unset user.email
cmdkey /list    //자격 증명 확인 목록
cmdkey /delete:git:https://github.com   //자격 증명 목록 삭제
`;

            copyText(cmd);
        }

        function copyCheckConfig() {

            const cmd =
                `git config --global --list
git config --global --show-origin user.name
git config --global --show-origin user.email`;

            copyText(cmd);
        }


        function copyInit() {

            const cmd =
                `git init`;

            copyText(cmd);
        }

        function copyRemote() {

            const cmd =
                `git remote add origin https://github.com/계정명/저장소명.git
git remote -v`;

            copyText(cmd);
        }

function copyPush() {

            const cmd =
                `git add .
git commit -m "first commit"
git branch -M main
git push -u origin main`;

            copyText(cmd);
        }

function copyPushUpdate(){

    copyText(
`git status
git add .
git commit -m "커밋메시지"
git push`
    );
}

function copyCommand() {

            const text =
                document.getElementById("result").textContent;

            navigator.clipboard.writeText(text);

            // alert("복사 완료");
            const msg =
            document.getElementById("copyMessage");

            msg.textContent = "✅ 복사되었습니다.";

            setTimeout(() => {
                msg.textContent = "";
            }, 1500);
        }

 function copyCheckConfig(){

    copyText(
`git config --global --list
git config --global --show-origin user.name
git config --global --show-origin user.email`
    );
}

function copyStatus(){

    copyText(
`git status`
    );
}

function copyBranch(){

    copyText(
`git branch`
    );
}

function copyRemote(){

    const username =
        document.getElementById("username").value;

    const repository =
        document.getElementById("repository").value;

    copyText(
`git remote add origin ${repository}`
    );
}

function copyRemoteCheck(){

    copyText(
`git remote -v`
    );
}

function copyRemoteRemove(){

    copyText(
`git remote remove origin`
    );
}

function copyAdd(){

    copyText(
`git add .`
    );
}

function copyCommit(){

    copyText(
`git commit -m "커밋메시지"`
    );
}

// function copyPush(){

//     copyText(
// `git push -u origin main`
//     );
// }

function copyPull(){

    copyText(
`git branch
git remote -v
git pull origin main`
    );
}

function copyCommitMail(){

    copyText(
`
init:    프로젝트 시작
feat:    기능 추가
fix:     버그 수정
docs:    문서 작성
study:   학습 기록
외에 본인 자율적으로 문구 기록
`
    );
}

function copyClone(){
    const repository =
        document.getElementById("repository").value;

    copyText(
`git clone ${repository}`
    );
}

// 브런치 
function copyBranchAll() {

    copyText(
`git branch -a`
    );
}

function copyBranchCreate() {

    const branch =
        document.getElementById("branch").value;

    copyText(
`git branch ${branch}

git branch`
    );
}

function copyBranchSwitch() {

    const branch =
        document.getElementById("branch").value;

    copyText(
`git branch

git switch ${branch}`
    );
}

function copyBranchCreateSwitch() {

    const branch =
        document.getElementById("branch").value;

    copyText(
`git switch -c ${branch}

git branch`
    );
}

function copyBranchMain() {

    copyText(
`git branch -M main

git branch`
    );
}

function copyBranchDelete() {

    const branch =
        document.getElementById("branch").value;

    copyText(
`git branch

git branch -d ${branch} //로컬
git push origin --delete ${branch}  //원격


git branch`
    );
}

function copyBranchMerge() {

    const branch =
        document.getElementById("branch").value;

    copyText(
`git switch main

git merge ${branch}

git branch`
    );
}

        // 호환성으로 변경
        function copyText(text) {

            const textarea =
                document.createElement("textarea");

            textarea.value = text;

            document.body.appendChild(textarea);

            textarea.select();

            document.execCommand("copy");

            document.body.removeChild(textarea);

            document.getElementById("result").textContent = text;

            // alert("복사 완료");
            const msg =
                document.getElementById("copyMessage");

            msg.textContent = "✅ 복사되었습니다.";

            setTimeout(() => {
                msg.textContent = "";
            }, 1500);
        }
    </script>
</body>

</html>
