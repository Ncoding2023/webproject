<!DOCTYPE html>
<html lang='ko'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>박스 모델 구조 예제</title>
    <link rel="stylesheet" href="../css/exam20_box_model_card.css">
</head>

<!-- 이건 가독성있고 확실히 좋네  -->
<body>
    <h1>박스 모델 구조 이해하기</h1>
    <div class="box-model">
        <span class="label">margin</span>

        <div class="border-area">
        <span class="label">border</span>

            <div class="padding-area">
            <span class="label">padding</span>

                <div class="content-area">
                <h2>content</h2>
                <p>
                    content는 실제 텍스트나 이미지가 표시되는 영역
                    padding은 콘텐츠와 테두리 사이의 안쪽 여백
                    border는 요소의 테두리
                </p>
                <p>
                    margin은 테두리 바깥쪽 여벽,
                    다른 요소와의 간격을 만드는 데 사용
                </p>
                </div>

            </div>

        </div>

        <ul class="info-list">
            <li>margin: 요소와 다른 요소 사이의 공간</li>
            <li>border: 요소를 둘러싸는 선</li>
            <li>padding: 콘텐츠와 테두리 사이의 공간</li>
            <li>content: 실제 내용이 들어가는 영역</li>
        </ul>
    </div>

            

</body>

</html>
!
