<!DOCTYPE html>
<html lang='ko'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>프로필 목록 세로 배치 예제</title>
    <link rel="stylesheet" href="../css2/exam23_flex_card.css">
</head>
<body>
    <h1>웹 개발 학습 과정</h1>
    
    <div class="card-list">
        <div class="card">
            <h2>HTML</h2>
            <p>
                HTML은 웹 페이지의 구조를 만드는 언어
                제목, 문단, 목록, 이미지, 링크 등을 작성
            </p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>
                CSS는 웹 페이지의 디자인을 담당하는 언어
                색상, 글꼴, 여백, 배치 등을 설정
            </p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>
                JavaScript는 웹 페이지에 동작을 추가하는 언어
                버튼 클릭, 입력값 처리, 화면 변경 등을 구현
            </p>
        </div>
    </div>

</body>
</html>
