<!DOCTYPE html>
<html lang='ko'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Grid 이미지 갤러리</title>
    <link rel="stylesheet" href="../css2/exam28_grid_gallery.css">
</head>
<body>
    <h1>Grid 이미지 갤러리</h1>
    <p class="desc">
        Grid Layout을 사용하여 이미지의 크기가 서로 다른 캘러리를 구성한 예제입니다.
    </p>

    <div class="gallery-containner">
        <div class="gallery-item big">
            <img src="../image/bear.jpg" alt="곰">
        </div>

        <div class="gallery-item">
            <img src="../image/cat.gif" alt="고양이">
        </div>
        
        <div class="gallery-item">
            <img src="../image/photo.jpg" alt="풍경">
        </div>

        <div class="gallery-item wide">
            <img src="../image/guitar-bg.jpg" alt="기타">
        </div>

        <div class="gallery-item tall">
            <img src="../image/bg.jpg" alt="배경">
        </div>

        <div class="gallery-item">
            <img src="../image/pic2.jpg" alt="사진">
        </div>
    </div>
</body>
</html>
