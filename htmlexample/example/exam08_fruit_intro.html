<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>과일 소개</title>
</head>
<body>
        <h1>🍉 상큼한 과일 소개🍋‍🟩</h1>

        <p>겁나게 비싼 과일의 특징과 장점을 알아보자</p>
        
        <h2>🍎🍏사과</h2>
        <figure>
            <img src="../image/apple.png" alt="빨간 사과 이미지" width="300">
            <figcaption>아삭하고 달콤한 사과</figcaption>
        </figure>

        <ul>
            <li>식감이 아삭</li>
            <li>간식으로 먹기 좋다</li>
            <li>주스나 샐러드에도 활용 가능</li>
            <li>비싸다</li>
        </ul>
        <hr>

        <h2>🍌🍌바나나🐵</h2>
        <figure>
            <img src="../image/banana.png" alt="노란 바나나 이미지" width="300">
            <figcaption>부드럽고 든든한 바나나</figcaption>
        </figure>

        <ul>
            <li>껍질이 있다</li>
            <li>아침에 식사 대용이지만 혈당 스파이크</li>
            <li>우유와 함께 갈아 마시기 좋으나 이것도 혈당 스파이크</li>
            <li>탄수화물과 당이 매우 풍부하다</li>
        </ul>
        <hr>

        <h2>과일 용어 정리</h2>
        <dl>
            <dt>과육</dt>
            <dd>과일에서 먹을 수 있는 부드러운 부분</dd>

            <dt>껍질</dt>
            <dd>과일의 겉부분을 감싸고 있는 부분</dd>

            <dt>씨</dt>
            <dd>과일 안에 들어 있는 단단한 알갱이</dd>

        </dl>



       
</body>
</html>
