<!DOCTYPE html>
<html lang='ko'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>나의 하루 계획</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <h1>나의 하루 계획</h1>
    <p>
        오늘 하루 동안 해야 할 일을 시간대별로 정리한 페이지입니다
    </p>

    <hr>

    <div>
        <h2>오전</h2>
            <p>
                <span>09:00</span> - 수업시작<br>
                <span>11:00</span> - 학습하며 개인 프로젝트 개발<br>
                <span>12:00</span> - 점심 전 마지막 수업<br>
            </p>

    </div>
    <hr>
    

    <div>
        <h2>오후</h2>
            <p>
                <span>14:00</span> - 점심이후로 수업시작<br>
                <span>18:00</span> - 수업 종료이후 나머지 수업<br>
                <span>19:00</span> - 귀가<br>
            </p>

    </div>
    <hr>
<div>
        <h2>오늘 중요 일정</h2>
            <p>
                프로젝트 시작하면서 개발 시작한다. <mark>구조 파악</mark>은 얼마나 하고 시작해야하는지
            </p>

    </div>

    <p>이번에도 안되면 알바구해서 다른일이나 찾자</p>

</body>
</html>
